[build]
  publish = "client/dist"
  command = "npm --prefix client install && npm --prefix client run build"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源长期缓存（文件名带 hash，变更即新 URL）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 入口不缓存（确保每次发版用户拿最新页面）
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
