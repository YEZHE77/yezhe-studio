# Cloudflare Worker —— 私有 R2 桶图片只读代理
# 已自动填入当前账号配置，直接执行：
#   npx wrangler login
#   npx wrangler deploy

name = "yezhe-img-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"
account_id = "0bde736e2d9fef22b049ffc833bae06c"

# 绑定私有 R2 桶
[[r2_buckets]]
binding = "R2"
bucket_name = "yezhe-studio-img"

# 防盗链 Referer 白名单（逗号分隔）。
# 当前线上商家后台部署在 Cloudflare Pages：yezhe-studio.pages.dev
# 微信小程序 wx.request 不发送 Referer → 直接放行；其他带 Referer 的外部域名 → 403。
# 若已绑定自定义 CDN 域名（如 img.yezhe.studio），请在此追加该域名。
[vars]
ALLOWED_REFERERS = "yezhe-studio.pages.dev,yezhe-studio.netlify.app"
