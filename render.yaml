# Render Blueprint —— 后端服务一键部署
# 用法：Render 控制台 → New → Blueprint → 关联本仓库 → 自动按此文件建服务。
# 自动注入 PORT，生产用 DATABASE_URL(Postgres) 切换方言，业务代码无需改动。
services:
  - type: web
    name: yezhe-studio-server
    runtime: node
    rootDir: server            # 仅构建 server 子目录
    plan: free                 # 免费档；升级可去掉此行
    buildCommand: npm install && mkdir -p /usr/share/fonts/truetype/yezhe && cp server/fonts/NotoSansSC-Regular.otf /usr/share/fonts/truetype/yezhe/ && fc-cache -fv > /dev/null 2>&1 || true
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true           # 推 main 分支自动重新部署
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL       # Neon Postgres 连接串（控制台填）
        sync: false
      - key: JWT_SECRET         # 自动生成随机密钥
        generateValue: true
      - key: WX_APPID           # 微信小程序 AppID（控制台填）
        sync: false
      - key: WX_SECRET          # 微信小程序 AppSecret（控制台填）
        sync: false
      - key: CORS_ORIGIN        # 网页后台(H5)公网域名，逗号分隔可写多个
        value: https://yezhe-studio.pages.dev
      - key: R2_ENDPOINT        # Cloudflare R2（私有桶 + Worker 代理，图片持久化）。五项(R2_ENDPOINT/R2_BUCKET/R2_WORKER_DOMAIN/R2_ACCESS_KEY/R2_SECRET_KEY)齐全才启用。
        sync: false
      - key: R2_BUCKET           # R2 桶名（私有，不公开）
        sync: false
      - key: R2_WORKER_DOMAIN   # Worker 代理域名，如 https://yezhe-img-proxy.<sub>.workers.dev 或 https://shturl.cc/Z（数据库只存此域名，前端不直连 R2）
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: COS_SECRET_ID       # 腾讯云 COS（S3 兼容，推荐主用）。COS_* 五项齐全即启用，优先级高于 R2。
        sync: false
      - key: COS_SECRET_KEY
        sync: false
      - key: COS_BUCKET          # COS 桶名（私有，不公开）
        sync: false
      - key: COS_REGION          # COS 地域，如 ap-guangzhou
        sync: false
      - key: COS_CDN_DOMAIN      # COS 自定义加速域名（公网 HTTPS），如 https://img.yezhe.com；数据库只存此域名，前端不直连 COS 源站
        sync: false
      - key: CF_API_TOKEN        # Cloudflare API 令牌（只读 analytics，用于容量/流量统计）。可选；填了才显示真实用量。
        sync: false
      - key: CF_ACCOUNT_ID       # Cloudflare 账号 ID（与 CF_API_TOKEN 配套）
        sync: false
      - key: UPLOAD_TOKEN        # 上传 Worker 令牌；启用直传 Worker 时必填，需与 Worker 的 UPLOAD_TOKEN 一致
        sync: false
